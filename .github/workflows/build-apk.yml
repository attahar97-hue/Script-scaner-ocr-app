name: Build APK and Play Store AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version!"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 21 ]; then
            echo "::error::Active Java major version is $JAVA_MAJOR, which is lower than 21!"
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore permanent release and debug keystores
        run: |
          if [ -f "release.keystore.base64" ]; then
            echo "Decoding permanent release.keystore from release.keystore.base64..."
            base64 -d release.keystore.base64 > release.keystore
          fi
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "./release.keystore" ]; then
            echo "::error::release.keystore is missing!"
            exit 1
          fi
          echo "Verified permanent release keystore is present."
          keytool -list -v -keystore release.keystore -storepass android | grep -E "SHA1|SHA256" || true

      - name: Build Play Store AAB & Debug APK
        run: |
          gradle :app:bundleRelease :app:assembleDebug --stacktrace --no-daemon

      - name: Verify build outputs
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_AAB="app/build/outputs/bundle/release/app-release.aab"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK does not exist!"
            exit 1
          fi
          if [ ! -f "$EXPECTED_AAB" ]; then
            echo "::error::AAB file $EXPECTED_AAB does not exist!"
            exit 1
          fi

          echo "Confirmed: Both APK ($EXPECTED_APK) and AAB ($EXPECTED_AAB) exist and are non-empty."
          echo "=== AAB Signature Certificate Fingerprints ==="
          keytool -printcert -jarfile "$EXPECTED_AAB" | grep -E "SHA1|SHA256" || true

      - name: Upload Play Store AAB Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Assets
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d -t release-assets-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          
          APK_FILENAME="${REPO_NAME}-debug-v1.3-build-${{ github.run_number }}.apk"
          AAB_FILENAME="${REPO_NAME}-playstore-v1.3-build-${{ github.run_number }}.aab"
          
          TARGET_APK="${ASSET_DIR}/${APK_FILENAME}"
          TARGET_AAB="${ASSET_DIR}/${AAB_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_APK"
          cp "app/build/outputs/bundle/release/app-release.aab" "$TARGET_AAB"

          echo "Prepared APK asset: $TARGET_APK"
          echo "Prepared AAB asset: $TARGET_AAB"
          
          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$TARGET_AAB" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "aab_filename=$AAB_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_APK="${{ steps.prepare_asset.outputs.apk_path }}"
          TARGET_AAB="${{ steps.prepare_asset.outputs.aab_path }}"

          RELEASE_TAG="v1.3-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Release & Testing Build v1.3 (#${{ github.run_number }})"

          BODY_FILE=$(mktemp)
          cat << 'EOF' > "$BODY_FILE"
          ### 📱 Build Artifacts (Play Store AAB & Direct APK)

          This release contains the latest automated build outputs:

          - 📦 **Google Play Store App Bundle:** Ready to upload directly to Play Console Testing / Production (`.aab`)
          - 📲 **Debug APK:** Direct install on Android phone for immediate testing (`.apk`)
          - **Version:** `1.3` (VersionCode: `4`)
          - **Workflow Run:** #${{ github.run_number }}
          - **Source Commit:** ${{ github.sha }}

          #### Features Included:
          - ✨ Smart 4-Corner Edge & Boundary Document Detection & Crop (کیم اسکینر)
          - 🧮 Professional Business & Shop Calculator (کاروباری حساب کتاب)
          - 💎 Islamic Zakat & Nisab Multi-Currency Calculator with 20+ countries support (اسلامی زکوٰۃ)
          - 🚀 Zero-crash stability and full Urdu language localization
          EOF

          echo "Creating GitHub release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$TARGET_APK" "$TARGET_AAB" \
            --title "$RELEASE_TITLE" \
            --notes-file "$BODY_FILE" \
            --target "${{ github.sha }}" \
            --latest

          rm -f "$BODY_FILE"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report Build & Download Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="v1.3-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            {
              echo "## 🚀 Play Store AAB & APK Build Summary"
              echo ""
              echo "✅ **Build & GitHub Release Successful!**"
              echo ""
              echo "- **Play Store Bundle (AAB):** \`${{ steps.prepare_asset.outputs.aab_filename }}\`"
              echo "- **Direct Test APK:** \`${{ steps.prepare_asset.outputs.apk_filename }}\`"
              echo "- **GitHub Release Link:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "You can download the \`.aab\` file directly from the Release page and upload it to Google Play Console."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🚀 Play Store AAB & APK Build Summary"
              echo ""
              echo "✅ **AAB & APK Artifacts Created Successfully!**"
              echo ""
              echo "- Download \`app-playstore-aab\` or \`app-debug-apk\` from the **Artifacts** section at the bottom of this run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
